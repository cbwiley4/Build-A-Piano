<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
        <title>Piano</title>
    </head>

    <body>
        <!-- Piano Container -->
        <div class="piano">
            <!-- Piano Notes -->
            <div data-note="C" class="key white"><p class="labels2">Z</p></div>
            <div data-note="Db" class="key black"><p class="labels">S</p></div>
            <div data-note="D" class="key white"><p class="labels2">X</p></div>
            <div data-note="Eb" class="key black"><p class="labels">D</p></div>
            <div data-note="E" class="key white"><p class="labels2">C</p></div>
            <div data-note="F" class="key white"><p class="labels2">V</p></div>
            <div data-note="Gb" class="key black"><p class="labels">G</p></div>
            <div data-note="G" class="key white"><p class="labels2">B</p></div>
            <div data-note="Ab" class="key black"><p class="labels">H</p></div>
            <div data-note="A" class="key white"><p class="labels2">N</p></div>
            <div data-note="Bb" class="key black"><p class="labels">J</p></div>
            <div data-note="B" class="key white"><p class="labels2">M</p></div>
        </div>

        <!-- Load Audio Files -->
        <audio id="C" src="notes/C.mp3"></audio>
        <audio id="Db" src="notes/Db.mp3"></audio>
        <audio id="D" src="notes/D.mp3"></audio>
        <audio id="Eb" src="notes/Eb.mp3"></audio>
        <audio id="E" src="notes/E.mp3"></audio>
        <audio id="F" src="notes/F.mp3"></audio>
        <audio id="Gb" src="notes/Gb.mp3"></audio>
        <audio id="G" src="notes/G.mp3"></audio>
        <audio id="Ab" src="notes/Ab.mp3"></audio>
        <audio id="A" src="notes/A.mp3"></audio>
        <audio id="Bb" src="notes/Bb.mp3"></audio>
        <audio id="B" src="notes/B.mp3"></audio>


    </body>
    <footer></footer>
</html>
